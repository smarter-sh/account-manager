---
#------------------------------------------------------------------------------
# Tests: run the Django unit tests under coverage.py, and upload the report to
# Codecov for the README's coverage badge.
#
# Runs on pull requests to main, on pushes to main (so that main itself has a
# coverage report for the badge), and by hand.
#
# The tests run in the am image (Dockerfile, ENVIRONMENT=local, which installs
# the development requirements), in the docker-compose.yml stack that
# `make docker-init` starts, as `make coverage` does locally. Coverage options are in
# am/.coveragerc. The tests mock every external service (AWS, SMTP, Stripe), so
# the .env this workflow writes holds placeholders only, plus a throwaway
# Django secret key.
#
# Secrets (organization): CODECOV_TOKEN, DOCKERHUB_USERNAME and DOCKERHUB_PAT.
#------------------------------------------------------------------------------
name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # docker compose reads build args and container environment from .env.
      - name: Create .env
        shell: bash
        run: |
          cp .env.example .env
          {
            echo "ENVIRONMENT=local"
            echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          } >> .env

      # Logged-in Docker Hub pulls: the python base image (see PYTHON_BASE_IMAGE
      # in the Dockerfile), mariadb and redis.
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the am image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: am:latest
          build-args: |
            ENVIRONMENT=local
            PYTHON_BASE_IMAGE=docker.io/library/python:3.14-slim-trixie
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts the whole docker-compose.yml stack, creates the database and
      # migrates, as locally (and as smarter's Tests workflow does).
      - name: make docker-init
        shell: bash
        run: make docker-init

      # As `make coverage` does.
      - name: Run unit tests with coverage
        shell: bash
        run: |
          mkdir -p coverage-out
          docker exec am-app bash -c "\
            coverage run manage.py test am --noinput; status=\$?; \
            coverage report; \
            coverage xml -o /tmp/coverage.xml; \
            exit \$status"; status=$?
          docker cp am-app:/tmp/coverage.xml coverage-out/coverage.xml || true
          exit $status

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage-out/coverage.xml ]; then
            rate=$(python3 -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage-out/coverage.xml').getroot().get('line-rate')) * 100, 1))")
            echo "## Python coverage: ${rate}%" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage-out/coverage.xml
          flags: python
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Container logs
        if: failure()
        shell: bash
        run: docker compose logs --no-color --tail=200
