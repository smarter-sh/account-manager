---
#------------------------------------------------------------------------------
# - Deploy to AWS Elastic Kubernetes Service (EKS)
#
# IMPORTANT: Before running this workflow, ensure that:
#
# - the Smarter platform is deployed to the same environment: Account Manager
#   uses its MariaDB server (the Service smarter-mariadb in the namespace
#   <SMARTER_NAMESPACE_BASE>-<environment>) and has none of its own;
# - terraform/aws has created Account Manager's namespace and its Kubernetes
#   secrets (mysql-am, mysql-root, am-admin, am-django-secret-key, aws-ses-config);
# - the following secrets are configured in the
#   [GitHub repository settings](https://github.com/smarter-sh/account-manager/settings/secrets/actions):
#
# AWS_ACCESS_KEY_ID
# AWS_REGION
# AWS_SECRET_ACCESS_KEY
#------------------------------------------------------------------------------
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  ROOT_DOMAIN: "smarter.sh"
  # the EKS cluster that Account Manager is deployed to
  EKS_CLUSTER_NAME: "apps-hosting-service"
  # the Smarter platform's namespace is <SMARTER_NAMESPACE_BASE>-<environment>; its
  # smarter-mariadb Service is the shared database server
  SMARTER_NAMESPACE_BASE: "smarter-ubc"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set environment variable
        id: setenv
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/alpha" ]]; then
            echo "ENVIRONMENT=alpha" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/beta" ]]; then
            echo "ENVIRONMENT=beta" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/next" ]]; then
            echo "ENVIRONMENT=next" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "This workflow can only run on alpha, beta, next, or main branches"
            exit 1
          fi

      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          environment: ${{ env.ENVIRONMENT }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          root-domain: ${{ env.ROOT_DOMAIN }}
          eks-cluster-name: ${{ env.EKS_CLUSTER_NAME }}
          smarter-namespace-base: ${{ env.SMARTER_NAMESPACE_BASE }}

      - name: Send Email
        uses: ./.github/actions/send-mail
        with:
          environment: ${{ env.ENVIRONMENT }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          subject: "GHA - Deployed ${{ env.ENVIRONMENT }}.am.smarter.sh"
          body: "${{ env.ENVIRONMENT }}.am.smarter.sh was deployed successfully."
