version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/am/requirements/in"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
    labels:
      - "dependencies"
      - "python"
      - "automated pr"
    assignees:
      - "lpm0073"
    reviewers:
      - "lpm0073"
  - package-ecosystem: "npm"
    directory: "/"
    labels:
      - "dependencies"
      - "javascript"
      - "automated pr"
    schedule:
      interval: "quarterly"
    target-branch: "alpha"
    assignees:
      - "lpm0073"
    reviewers:
      - "lpm0073"
  - package-ecosystem: "github-actions"
    directory: "/.github"
    labels:
      - "dependencies"
      - "automated pr"
    schedule:
      interval: "quarterly"
    target-branch: "alpha"
    assignees:
      - "lpm0073"
    reviewers:
      - "lpm0073"
  - package-ecosystem: "helm"
    directory: "/helm/charts/am"
    schedule:
      interval: "quarterly"
  - package-ecosystem: "terraform"
    directory: "/terraform/"
    schedule:
      interval: "quarterly"
    target-branch: "alpha"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated pr"
    assignees:
      - "lpm0073"
    reviewers:
      - "lpm0073"
