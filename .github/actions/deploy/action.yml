name: Deploy to Kubernetes
branding:
  icon: "play-circle"
  color: "green"
inputs:
  environment:
    description: "The environment to deploy"
    required: true
  aws-access-key-id:
    description: "The AWS access key ID"
    required: true
  aws-secret-access-key:
    description: "The AWS secret access key"
    required: true
  aws-region:
    description: "The AWS region to deploy to"
    required: true
  fernet-encryption-key:
    description: "The Fernet encryption key"
    required: true
  root-domain:
    description: "The root domain for the deployment"
    required: true
  mailchimp-api-key:
    description: "The Mailchimp API key"
    required: true
  mailchimp-list-id:
    description: "The Mailchimp list ID"
    required: true

runs:
  using:
    "composite"
    # -------------------------------------------------------------------------
    # This action is designed to be run on an ephemeral Ubuntu Linux runner.
    # We start with a clean environment and install and configure all the
    # tools we need for this job.
    #
    # The runner is destroyed after the job completes, so we don't need to
    # worry about cleaning up after ourselves.
    # -------------------------------------------------------------------------
  steps:
    # Initialize environment variables that are derived from the inputs
    - name: Initialize environment variables
      shell: bash
      run: |-
        echo "NAMESPACE=${{ env.NAMESPACE_BASE }}-${{ inputs.environment }}" >> $GITHUB_ENV
        echo "DJANGO_SETTINGS_MODULE=${{ env.DJANGO_SETTINGS_BASE }}.${{ inputs.environment }}" >> $GITHUB_ENV
        echo "CACHES_LOCATION=${{ env.REDIS_URL }}" >> $GITHUB_ENV
        echo "CELERY_BROKER_URL=${{ env.REDIS_URL }}" >> $GITHUB_ENV
        echo "CELERY_RESULT_BACKEND=${{ env.REDIS_URL }}" >> $GITHUB_ENV
      env:
        REDIS_URL: redis://:am@am-redis-master.smarter-am-${{ inputs.environment }}.svc.cluster.local:6379/1
        DJANGO_SETTINGS_BASE: am.settings
        NAMESPACE_BASE: smarter-am

    # Checkout all code referenced by this action
    - name: Checkout code
      id: checkout_code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    # authenticate AWS CLI
    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    # put an entry in the run log to show the aws cli version and the IAM user
    - name: Check awscli version and identity
      id: awscli-version
      shell: bash
      run: |-
        echo "aws cli version:"
        echo "----------------"
        aws --version
        echo
        echo "aws IAM user:"
        echo "-------------"
        aws sts get-caller-identity

    # install kubectl, which Helm will use to deploy the application
    - name: Install kubectl
      id: kubectl-install
      shell: bash
      run: |-
        sudo snap install kubectl --classic

    # setup kubeconfig using the aws eks helper command, 'update-kubeconfig'
    - name: Configure kubectl
      id: kubectl-configure
      shell: bash
      run: |-
        aws eks --region ${{ inputs.aws-region }} update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --alias ${{ env.EKS_CLUSTER_NAME }}
        echo "kubectl version and diagnostic info:"
        echo "------------------------------------"
        kubectl version
      env:
        EKS_CLUSTER_NAME: apps-hosting-service

    # install jq, which k8s-get-secret will use to parse the Kubernetes secret
    # and set the environment variables
    - name: Install jq
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    # connect to Amazon ECR so that we can programmatically
    # figure out the Docker image to add to the Helm values for the
    # Kubernetes deployment manifest.
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    # set the Docker image to the environment variable AM_DOCKER_IMAGE
    # example:  012345678903.dkr.ecr.us-east-2.amazonaws.com/smarter-am-alpha:latest
    - name: Set Docker image
      id: set-docker-image
      shell: bash
      run: |-
        echo "AM_DOCKER_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPO }}:latest" >> $GITHUB_ENV
      env:
        AWS_ECR_REPO: ${{ env.NAMESPACE }}

    # extract the mysql configuration from the Kubernetes secret.
    # these will be set as environment variables for the Helm deployment
    #
    # example:
    # MYSQL_HOST: mysql.service.lawrencemcdaniel.com
    # MYSQL_PORT: 3306
    # MYSQL_DATABASE: smarter_am_alpha
    # MYSQL_USER: smarter_am_alpha
    # MYSQL_PASSWORD: top-secret-password
    - name: Configure MySQL from Kubernetes secret
      id: get-mysql-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: mysql-am

    # extract the mysql root configuration from the Kubernetes secret.
    # these will be set as environment variables for the Helm deployment
    #
    # example:
    # MYMYSQL_ROOT_USERNAMESQL_USER: root
    # MYSQL_ROOT_PASSWORD: top-secret-password
    - name: Configure MySQL from Kubernetes secret
      id: get-mysql-root-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: mysql-root

    # extract the Django admin user credentials from the Kubernetes secret.
    # these will be set as environment variables for the Helm deployment
    #
    # example:
    # AM_LOGIN_URL: https://alpha.am.smarter.sh/login/
    # AM_ADMIN_USERNAME: admin
    # AM_ADMIN_PASSWORD: top-secret-password
    - name: Configure admin user from Kubernetes secret
      id: get-admin-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: am-admin

    # extract the Django application secret from the Kubernetes secret.
    # these will be set as environment variables for the Helm deployment
    #
    # example:
    # SECRET_KEY: top-secret-key
    - name: Configure django secret from Kubernetes secret
      id: get-django-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: am-django-secret-key

    # see: https://github.com/helm/helm
    #      we're installing directly from the github repo amd64 binary
    - name: Install Helm
      id: helm-install
      shell: bash
      run: |-
        curl -LO https://get.helm.sh/helm-v3.14.2-linux-amd64.tar.gz
        tar -zxvf helm-v3.14.2-linux-amd64.tar.gz
        sudo mv linux-amd64/helm /usr/local/bin/helm

    # Dump all of our environment variables to the run log
    - name: Dump environment variables
      id: dump-env
      shell: bash
      run: |-
        echo "env"
        echo "-------------------------------"
        env

    - name: Delete failed jobs
      id: delete-failed-jobs
      shell: bash
      run: |-
        kubectl delete job am-db-init-job --namespace ${{ env.NAMESPACE }} || true

    - name: Update Helm charts
      id: helm-update
      shell: bash
      run: |-
        cd helm/charts/account-manager
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm dependency build

    # Create a temporary values file with secrets
    - name: Create secrets values file
      id: create-secrets-values
      shell: bash
      run: |-
        cat > /tmp/values.yaml <<EOF
        deployTimestamp: "$(date +%s)"

        env:
          # Deployment
          DJANGO_SETTINGS_MODULE: "${{ env.DJANGO_SETTINGS_MODULE }}"
          ENVIRONMENT: "${{ inputs.environment }}"
          NAMESPACE: "${{ env.NAMESPACE }}"
          AM_DOCKER_IMAGE: "${{ env.AM_DOCKER_IMAGE }}"

          # AWS
          AWS_REGION: "${{ inputs.aws-region }}"
          AWS_ACCESS_KEY_ID: "${{ inputs.aws-access-key-id }}"
          AWS_SECRET_ACCESS_KEY: "${{ inputs.aws-secret-access-key }}"

          # Security
          FERNET_ENCRYPTION_KEY: "${{ inputs.fernet-encryption-key }}"
          SECRET_KEY: "${{ env.SECRET_KEY }}"

          # Email
          MAILCHIMP_API_KEY: "${{ inputs.mailchimp-api-key }}"
          MAILCHIMP_LIST_ID: "${{ inputs.mailchimp-list-id }}"

          ROOT_DOMAIN: "${{ inputs.root-domain }}"


          # Database
          MYSQL_HOST: "${{ env.MYSQL_HOST }}"
          MYSQL_PORT: "${{ env.MYSQL_PORT }}"
          MYSQL_DATABASE: "${{ env.AM_MYSQL_DATABASE }}"
          MYSQL_USER: "${{ env.AM_MYSQL_USERNAME }}"
          MYSQL_PASSWORD: "${{ env.AM_MYSQL_PASSWORD }}"
          MYSQL_ROOT_USERNAME: "${{ env.MYSQL_ROOT_USERNAME }}"
          MYSQL_ROOT_PASSWORD: "${{ env.MYSQL_ROOT_PASSWORD }}"

          # Admin
          AM_LOGIN_URL: "${{ env.AM_LOGIN_URL }}"
          AM_ADMIN_PASSWORD: "${{ env.AM_ADMIN_PASSWORD }}"
          AM_ADMIN_USERNAME: "${{ env.AM_ADMIN_USERNAME }}"
          AM_ADMIN_EMAIL: "${{ env.AM_ADMIN_EMAIL }}"

          # Cache/Celery
          CACHES_LOCATION: "${{ env.CACHES_LOCATION }}"
          CELERY_BROKER_URL: "${{ env.CELERY_BROKER_URL }}"
          CELERY_RESULT_BACKEND: "${{ env.CELERY_RESULT_BACKEND }}"
        EOF

    # Deploy the application to Kubernetes using Helm
    - name: Deploy
      id: deploy
      shell: bash
      run: |-
        helm upgrade --install --force account-manager ./helm/charts/account-manager/ \
          --namespace ${{ env.NAMESPACE }} \
          --timeout 900s \
          --values /tmp/values.yaml

    # Clean up secrets file
    - name: Clean up secrets
      if: always()
      shell: bash
      run: rm -f /tmp/values.yaml
