---
#------------------------------------------------------------------------------
# Deploy Account Manager to Kubernetes with Helm.
#
# Account Manager has no database server of its own: it uses the shared MariaDB
# server of the smarter Helm chart, the Service smarter-mariadb in the Smarter
# platform's namespace. The chart's init job (job-init.yaml) creates Account
# Manager's database and user on that server, as its root user.
#
# The credentials come from Kubernetes secrets in Account Manager's namespace,
# which terraform/aws creates:
#
#   mysql-am:             AM_MYSQL_DATABASE, AM_MYSQL_USER, AM_MYSQL_PASSWORD
#   mysql-root:           MYSQL_HOST, MYSQL_PORT, MYSQL_ROOT_USERNAME, MYSQL_ROOT_PASSWORD
#                         (the shared server's)
#   am-admin:             AM_ADMIN_USERNAME, AM_ADMIN_EMAIL, AM_ADMIN_PASSWORD, AM_LOGIN_URL
#   am-django-secret-key: SECRET_KEY
#   aws-ses-config:       SMTP_HOST, SMTP_PORT, SMTP_USE_SSL, SMTP_USE_TLS, SMTP_USERNAME, SMTP_PASSWORD
#
# k8s-get-secret masks every value before it is written to the environment.
# This repository is public, and so are its workflow logs: no step may print
# a credential.
#------------------------------------------------------------------------------
name: Deploy to Kubernetes
description: "Deploy Account Manager to the specified Kubernetes environment"
branding:
  icon: "play-circle"
  color: "green"
inputs:
  environment:
    description: "The environment to deploy: alpha, beta, next, prod"
    required: true
  aws-access-key-id:
    description: "The AWS access key ID"
    required: true
  aws-secret-access-key:
    description: "The AWS secret access key"
    required: true
  aws-region:
    description: "The AWS region to deploy to"
    required: true
  aws-iam-role-arn:
    description: "The IAM role (IRSA) of Account Manager's pods. When set, the pods get no AWS access keys: the keys only deploy."
    required: false
    default: ""
  root-domain:
    description: "The root domain for the deployment"
    required: true
  eks-cluster-name:
    description: "The EKS cluster to deploy to"
    required: false
    default: "apps-hosting-service"
  namespace-base:
    description: "The base name of Account Manager's namespace; the environment is appended, e.g. smarter-am-alpha"
    required: false
    default: "smarter-am"
  smarter-namespace-base:
    description: "The base name of the Smarter platform's namespace, whose smarter-mariadb Service is the shared database server, e.g. smarter-ubc (smarter-ubc-alpha)"
    required: false
    default: "smarter-ubc"
  mysql-host:
    description: "The shared MariaDB server's host. Empty: MYSQL_HOST of the mysql-root secret, else smarter-mariadb.<smarter-namespace-base>-<environment>.svc.cluster.local"
    required: false
    default: ""

runs:
  using:
    "composite"
    # -------------------------------------------------------------------------
    # This action is designed to be run on an ephemeral Ubuntu Linux runner.
    # We start with a clean environment and install and configure all the
    # tools we need for this job.
    #
    # The runner is destroyed after the job completes, so we don't need to
    # worry about cleaning up after ourselves.
    # -------------------------------------------------------------------------
  steps:
    # Initialize environment variables that are derived from the inputs
    - name: Initialize environment variables
      shell: bash
      run: |-
        echo "NAMESPACE=${{ inputs.namespace-base }}-${{ inputs.environment }}" >> $GITHUB_ENV
        echo "DJANGO_SETTINGS_MODULE=am.settings.${{ inputs.environment }}" >> $GITHUB_ENV
        # The cache and the Celery broker use different Redis databases, so that
        # cache.clear() can't delete the Celery queues.
        echo "CACHES_LOCATION=${REDIS_URL}/1" >> $GITHUB_ENV
        echo "CELERY_BROKER_URL=${REDIS_URL}/0" >> $GITHUB_ENV
        echo "CELERY_RESULT_BACKEND=${REDIS_URL}/0" >> $GITHUB_ENV
      env:
        REDIS_URL: redis://:am@am-redis-master.${{ inputs.namespace-base }}-${{ inputs.environment }}.svc.cluster.local:6379

    # Checkout all code referenced by this action
    - name: Checkout code
      id: checkout_code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    # authenticate AWS CLI
    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Check awscli version
      id: awscli-version
      shell: bash
      run: aws --version

    # install jq, which k8s-get-secret uses to parse the Kubernetes secrets, and kubectl
    - name: Install jq and kubectl
      shell: bash
      run: |-
        sudo apt-get update
        sudo apt-get install -y jq
        sudo snap install kubectl --classic

    # setup kubeconfig using the aws eks helper command, 'update-kubeconfig'
    - name: Configure kubectl
      id: kubectl-configure
      shell: bash
      run: |-
        aws eks --region "${{ inputs.aws-region }}" update-kubeconfig --name "${{ inputs.eks-cluster-name }}" --alias "${{ inputs.eks-cluster-name }}"
        echo "kubectl version:"
        echo "----------------"
        kubectl version

    # connect to Amazon ECR so that we can programmatically
    # figure out the Docker image to add to the Helm values for the
    # Kubernetes deployment manifest.
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    # set the Docker image to the environment variable AM_DOCKER_IMAGE
    # example:  <registry>/smarter-am-alpha:latest
    - name: Set Docker image
      id: set-docker-image
      shell: bash
      run: |-
        echo "AM_DOCKER_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.NAMESPACE }}:latest" >> $GITHUB_ENV

    # Account Manager's own database and user on the shared server:
    # AM_MYSQL_DATABASE, AM_MYSQL_USER, AM_MYSQL_PASSWORD
    - name: Configure Account Manager's database from Kubernetes secret
      id: get-mysql-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: mysql-am

    # the shared MariaDB server and its root account:
    # MYSQL_HOST, MYSQL_PORT, MYSQL_ROOT_USERNAME, MYSQL_ROOT_PASSWORD
    - name: Configure the shared MariaDB server from Kubernetes secret
      id: get-mysql-root-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: mysql-root

    # AM_LOGIN_URL, AM_ADMIN_USERNAME, AM_ADMIN_EMAIL, AM_ADMIN_PASSWORD
    - name: Configure admin user from Kubernetes secret
      id: get-admin-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: am-admin

    # SECRET_KEY
    - name: Configure django secret from Kubernetes secret
      id: get-django-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: am-django-secret-key

    # SMTP_HOST, SMTP_PORT, SMTP_USE_SSL, SMTP_USE_TLS, SMTP_USERNAME, SMTP_PASSWORD
    - name: Configure SMTP email credentials from Kubernetes secret
      id: get-smtp-secret
      uses: ./.github/actions/k8s-get-secret
      with:
        eks-namespace: ${{ env.NAMESPACE }}
        eks-secret-name: aws-ses-config

    # The init and migrate jobs are named <release>-job-init-<timestamp> and
    # <release>-job-migrate-<timestamp>. A failed one is kept for kubectl logs;
    # delete it before the next attempt.
    - name: Delete failed jobs
      id: delete-failed-jobs
      shell: bash
      run: |-
        kubectl delete job --namespace "${{ env.NAMESPACE }}" --ignore-not-found \
          -l 'app.kubernetes.io/name in (account-manager-job-init,account-manager-job-migrate)' \
          --field-selector status.successful=0

    # Build the Helm values as JSON, with null for an empty value, which the chart's
    # Secret (secret-env.yaml) leaves out. Every value reaches jq through the step's
    # environment, never through the script's text, so a value can't break the JSON
    # or the shell, and nothing is echoed.
    - name: Create secrets values file
      id: create-json
      shell: bash
      env:
        AWS_IAM_ROLE_ARN: ${{ inputs.aws-iam-role-arn }}
        V_AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        V_AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        V_AWS_REGION: ${{ inputs.aws-region }}
        V_ENVIRONMENT: ${{ inputs.environment }}
        V_ROOT_DOMAIN: ${{ inputs.root-domain }}
        INPUT_MYSQL_HOST: ${{ inputs.mysql-host }}
        DEFAULT_MYSQL_HOST: smarter-mariadb.${{ inputs.smarter-namespace-base }}-${{ inputs.environment }}.svc.cluster.local
      run: |-
        set -euo pipefail
        # the shared server's host: the input, else the mysql-root secret's, else smarter-mariadb's in-cluster name
        AM_MYSQL_HOST="${INPUT_MYSQL_HOST:-${MYSQL_HOST:-$DEFAULT_MYSQL_HOST}}"
        echo "shared MariaDB server: $AM_MYSQL_HOST"
        export AM_MYSQL_HOST
        if [ -n "$AWS_IAM_ROLE_ARN" ]; then
          # the pods use the IAM role; the access keys only deploy
          V_AWS_ACCESS_KEY_ID=""
          V_AWS_SECRET_ACCESS_KEY=""
        fi
        export V_AWS_ACCESS_KEY_ID V_AWS_SECRET_ACCESS_KEY
        export DEPLOY_TIMESTAMP="$(date +%s)"
        jq -n '
          def v: if . == null or . == "" then null else . end;
          {
            deployTimestamp: env.DEPLOY_TIMESTAMP,
            serviceAccount: { awsRoleArn: (env.AWS_IAM_ROLE_ARN | v) },
            env: {
              AM_ADMIN_EMAIL: (env.AM_ADMIN_EMAIL | v),
              AM_ADMIN_PASSWORD: (env.AM_ADMIN_PASSWORD | v),
              AM_ADMIN_USERNAME: (env.AM_ADMIN_USERNAME | v),
              AM_DOCKER_IMAGE: (env.AM_DOCKER_IMAGE | v),
              AM_LOGIN_URL: (env.AM_LOGIN_URL | v),
              AM_MYSQL_DATABASE: (env.AM_MYSQL_DATABASE | v),
              AM_MYSQL_HOST: (env.AM_MYSQL_HOST | v),
              AM_MYSQL_PASSWORD: (env.AM_MYSQL_PASSWORD | v),
              AM_MYSQL_PORT: (env.MYSQL_PORT | v),
              AM_MYSQL_ROOT_PASSWORD: (env.MYSQL_ROOT_PASSWORD | v),
              AM_MYSQL_ROOT_USERNAME: (env.MYSQL_ROOT_USERNAME | v),
              AM_MYSQL_USER: (env.AM_MYSQL_USER | v),
              AWS_ACCESS_KEY_ID: (env.V_AWS_ACCESS_KEY_ID | v),
              AWS_REGION: (env.V_AWS_REGION | v),
              AWS_SECRET_ACCESS_KEY: (env.V_AWS_SECRET_ACCESS_KEY | v),
              CACHES_LOCATION: (env.CACHES_LOCATION | v),
              CELERY_BROKER_URL: (env.CELERY_BROKER_URL | v),
              CELERY_RESULT_BACKEND: (env.CELERY_RESULT_BACKEND | v),
              DJANGO_SETTINGS_MODULE: (env.DJANGO_SETTINGS_MODULE | v),
              ENVIRONMENT: (env.V_ENVIRONMENT | v),
              ROOT_DOMAIN: (env.V_ROOT_DOMAIN | v),
              SECRET_KEY: (env.SECRET_KEY | v),
              SMTP_HOST: (env.SMTP_HOST | v),
              SMTP_PASSWORD: (env.SMTP_PASSWORD | v),
              SMTP_PORT: (env.SMTP_PORT | v),
              SMTP_USERNAME: (env.SMTP_USERNAME | v),
              SMTP_USE_SSL: (env.SMTP_USE_SSL | v),
              SMTP_USE_TLS: (env.SMTP_USE_TLS | v)
            }
          }' > "$RUNNER_TEMP/values.json"

    - name: Convert values file from json to yaml
      id: convert-to-yaml
      shell: bash
      run: |-
        yq eval -P -p=json -o=yaml "$RUNNER_TEMP/values.json" > "$RUNNER_TEMP/values.yaml"
        rm -f "$RUNNER_TEMP/values.json"

    # see: https://github.com/helm/helm
    #      we're installing directly from the github repo amd64 binary
    - name: Install Helm
      id: helm-install
      shell: bash
      run: |-
        curl -LO https://get.helm.sh/helm-v3.14.2-linux-amd64.tar.gz
        tar -zxvf helm-v3.14.2-linux-amd64.tar.gz
        sudo mv linux-amd64/helm /usr/local/bin/helm

    - name: Update Helm charts
      id: helm-update
      shell: bash
      run: |-
        cd helm/charts/account-manager
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm dependency build

    # Deploy the application to Kubernetes using Helm. No database is provisioned
    # here: the chart's init job creates Account Manager's database and user on the
    # shared server.
    - name: Deploy
      id: deploy
      shell: bash
      run: |-
        helm upgrade --install --force account-manager ./helm/charts/account-manager/ \
          --namespace "${{ env.NAMESPACE }}" \
          --timeout 900s \
          --values "$RUNNER_TEMP/values.yaml"

    # Clean up secrets file
    - name: Clean up secrets
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/values.json" "$RUNNER_TEMP/values.yaml"
