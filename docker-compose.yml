---
#------------------------------------------------------------------------------
# For local development, you can use the following docker-compose file
# to run the application. This file will start a MySQL database, a Redis
# server, a Celery worker, and the application itself. The application
# will be available at http://localhost:8000.
#------------------------------------------------------------------------------
services:
  am-mysql:
    container_name: am-mysql
    mem_limit: 2g
    cpus: 0.5
    image: mysql:8
    command: ["mysqld", "--mysql-native-password=ON"]
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: am
      MYSQL_DATABASE: am
      MYSQL_USER: am
      MYSQL_PASSWORD: am
    ports:
      - 3306:3306
    volumes:
      - ./mysql-data:/var/lib/mysql

  am-redis:
    container_name: am-redis
    mem_limit: 1g
    cpus: 0.25
    image: redis:latest
    command: redis-server --requirepass am
    ports:
      - 6379:6379

  am-app:
    platform: linux/amd64
    container_name: am-app
    mem_limit: 4g
    cpus: 1
    user: am_user
    x-build:
      type: docker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT}
    image: am
    command: watchmedo auto-restart --directory=./am --pattern=*.py --recursive -- gunicorn am.wsgi:application -b 0.0.0.0:8000 --timeout 120
    volumes:
      - type: bind
        source: ./am
        target: /am
        consistency: cached
    ports:
      - 8000:8000
    depends_on:
      - am-mysql
      - am-redis
    env_file:
      - ./.env

  am-worker:
    platform: linux/amd64
    container_name: am-worker
    mem_limit: 2g
    cpus: 0.5
    user: am_user
    x-build:
      type: docker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT}
    image: am
    command: celery -A am.workers.celery.app worker --concurrency=4 --loglevel=info -Q default_celery_task_queue,beat_tasks -E
    depends_on:
      - am-mysql
      - am-redis
      - am-app
    env_file:
      - ./.env
    volumes:
      - type: bind
        source: ./am
        target: /am
        consistency: cached
    healthcheck:
      test: ["CMD", "celery", "-A", "am.workers.celery.app", "inspect", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3

  am-beat:
    platform: linux/amd64
    container_name: am-beat
    mem_limit: 1g
    cpus: 0.5
    user: am_user
    x-build:
      type: docker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT}
    image: am
    command: celery -A am.workers.celerybeat.app beat --loglevel=info
    depends_on:
      - am-mysql
      - am-redis
      - am-app
    env_file:
      - ./.env
    volumes:
      - type: bind
        source: ./am
        target: /am
        consistency: cached
    healthcheck:
      test: ["CMD", "celery", "-A", "am.workers.celerybeat.app", "inspect", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
