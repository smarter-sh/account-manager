---
#------------------------------------------------------------------------------
# For local development, you can use the following docker-compose file
# to run the application. This file will start a MySQL database, a Redis
# server, a Celery worker, and the application itself. The application
# will be available at http://localhost:8000.
#------------------------------------------------------------------------------
services:
  account-mysql:
    container_name: account-mysql
    mem_limit: 2g
    cpus: 0.5
    image: mysql:8
    command: ["mysqld", "--mysql-native-password=ON"]
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: account
      MYSQL_DATABASE: account
      MYSQL_USER: account
      MYSQL_PASSWORD: account
    ports:
      - 3306:3306
    volumes:
      - ./mysql-data:/var/lib/mysql

  account-redis:
    container_name: account-redis
    mem_limit: 1g
    cpus: 0.25
    image: redis:latest
    command: redis-server --requirepass account
    ports:
      - 6379:6379

  account-app:
    container_name: account-app
    mem_limit: 4g
    cpus: 1
    user: account_user
    x-build:
      type: docker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT}
    image: account
    command: watchmedo auto-restart --directory=./account --pattern=*.py --recursive -- gunicorn account.wsgi:application -b 0.0.0.0:8000 --timeout 120
    volumes:
      - type: bind
        source: ./account
        target: /account
        consistency: cached
    ports:
      - 8000:8000
    depends_on:
      - account-mysql
      - account-redis
    env_file:
      - ./.env

  account-worker:
    container_name: account-worker
    mem_limit: 2g
    cpus: 0.5
    user: account_user
    x-build:
      type: docker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT}
    image: account
    command: celery -A account.workers.celery.app worker --concurrency=4 --loglevel=info -Q default_celery_task_queue -E
    depends_on:
      - account-mysql
      - account-redis
      - account-app
    env_file:
      - ./.env
    volumes:
      - type: bind
        source: ./account
        target: /account
        consistency: cached
    healthcheck:
      test:
        ["CMD", "celery", "-A", "account.workers.celery.app", "inspect", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3

  account-beat:
    container_name: account-beat
    mem_limit: 1g
    cpus: 0.5
    user: account_user
    x-build:
      type: docker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT}
    image: account
    command: celery -A account.workers.celerybeat.app beat --loglevel=info
    depends_on:
      - account-mysql
      - account-redis
      - account-app
    env_file:
      - ./.env
    volumes:
      - type: bind
        source: ./account
        target: /account
        consistency: cached
    healthcheck:
      test:
        [
          "CMD",
          "celery",
          "-A",
          "account.workers.celerybeat.app",
          "inspect",
          "ping",
        ]
      interval: 30s
      timeout: 30s
      retries: 3
