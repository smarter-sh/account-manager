###############################################################################
# Account Manager's ServiceAccount
#
# {{ .Values.global.appName }}: the app, the Celery worker, beat, and the init
# and migrate jobs. None of them call the Kubernetes API, so the account has no
# Role, and its token is not mounted into the pods
# (automountServiceAccountToken: false).
#
# AWS: with serviceAccount.awsRoleArn, the EKS pod identity webhook gives the
# pods that IAM role (IRSA), and boto3 assumes it. Then the pods need no
# AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY in env. Static keys win over the
# role, so leave them out when the role is set. The webhook injects its own
# projected token, which does not depend on automountServiceAccountToken.
###############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Values.global.appName }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "am.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: "{{ .Values.global.appName }}"
  {{- with .Values.serviceAccount.awsRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: "{{ . }}"
  {{- end }}
automountServiceAccountToken: false
