# -----------------------------------------------------------------------------------
# Job Manifest for Account Manager Database Initialization
#
# A post-install/post-upgrade Helm hook that:
#
# - creates Account Manager's database and its user on the SHARED MariaDB server
#   (Smarter's, the smarter-mariadb Service of the smarter Helm chart, env.AM_MYSQL_HOST),
#   as env.AM_MYSQL_ROOT_USERNAME, and grants that user Account Manager's database only;
# - migrates, and initializes waffle, the Site, oscar's countries and the admin account.
#
# - Usage: rendered when databaseInit.enabled is set in values.yaml.
# - On an upgrade, job-migrate.yaml has already migrated, as a pre-upgrade hook, before the
#   rollout. This Job's migrate then finds nothing to do; it migrates a fresh install.
# - No credential is written into this template: every one comes from the environment,
#   i.e. the Secret in secret-env.yaml.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
{{- if .Values.databaseInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-job-init-{{ now | unixEpoch }}"
  namespace: "{{ .Release.Namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Release.Name }}"
    meta.helm.sh/release-namespace: "{{ .Release.Namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
    "helm.sh/hook": post-upgrade,post-install
    "helm.sh/hook-delete-policy": hook-succeeded
  labels:
    {{- include "am.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: "{{ .Values.global.appName }}-job-init"
    app.kubernetes.io/component: job-init
spec:
  # a step that fails part way is not retried blindly: MariaDB's DDL isn't transactional.
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        checksum/env: "{{ include (print $.Template.BasePath "/secret-env.yaml") . | sha256sum }}"
      labels:
        app.kubernetes.io/name: "{{ .Values.global.appName }}-job-init"
        app.kubernetes.io/component: job-init
        app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
        jobTimestamp: "{{ now | unixEpoch }}"
    spec:
      serviceAccountName: "{{ .Values.global.appName }}"
      automountServiceAccountToken: false
      affinity:
        {{- toYaml .Values.global.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      containers:
        - name: "{{ .Values.global.appName }}-job-init"
          image: '{{ include "am.image" . }}'
          imagePullPolicy: '{{ .Values.global.image.pullPolicy | default "Always" }}'
          resources:
            requests:
              memory: "500Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1"
          command:
            - /bin/sh
            - -c
          args:
            - |
              # Run every step, even after a failure, then exit non-zero if any step failed,
              # so that a failed step fails the Job (and the Helm hook) instead of being hidden.
              # run() echoes its command, so a step that carries a credential doesn't run through it.
              status=0
              run() {
                echo "--- $*"
                "$@" || { echo "FAILED: $*"; status=1; }
              }

              # The credentials come from the environment, i.e. the Secret in secret-env.yaml, never
              # from this template, so they aren't written into the Job's spec. The root password is
              # passed in MYSQL_PWD, where the mariadb client reads it, and each statement on stdin,
              # which keeps both the root password and AM_MYSQL_PASSWORD off the command line.
              # The client doesn't count MYSQL_PWD as a password, so it already skips checking the
              # server's certificate, with a warning on every call. --skip-ssl-verify-server-cert says
              # so explicitly and silences the warning; it changes nothing. The database runs inside the
              # cluster, where the network policies on app.kubernetes.io/application-group protect it,
              # and has no public CA. Revisit this if the database moves to a managed service such as
              # RDS, or outside the cluster's network: then verify with --ssl-ca.
              db() {
                echo "--- mariadb: $2"
                printf '%s\n' "$1" | MYSQL_PWD="$AM_MYSQL_ROOT_PASSWORD" mariadb \
                  --default-character-set=utf8mb4 --skip-ssl-verify-server-cert \
                  -u "$AM_MYSQL_ROOT_USERNAME" --host "$AM_MYSQL_HOST" --port "${AM_MYSQL_PORT:-3306}" \
                  || { echo "FAILED: mariadb: $2"; status=1; }
              }
              db "CREATE DATABASE IF NOT EXISTS \`$AM_MYSQL_DATABASE\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" "create database $AM_MYSQL_DATABASE"
              db "ALTER DATABASE \`$AM_MYSQL_DATABASE\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" "alter database $AM_MYSQL_DATABASE"
              db "CREATE USER IF NOT EXISTS '$AM_MYSQL_USER'@'%' IDENTIFIED BY '$AM_MYSQL_PASSWORD';" "create user $AM_MYSQL_USER"
              db "ALTER USER '$AM_MYSQL_USER'@'%' IDENTIFIED BY '$AM_MYSQL_PASSWORD';" "alter user $AM_MYSQL_USER"
              db "GRANT ALL PRIVILEGES ON \`$AM_MYSQL_DATABASE\`.* TO '$AM_MYSQL_USER'@'%'; FLUSH PRIVILEGES;" "grant $AM_MYSQL_USER all privileges on $AM_MYSQL_DATABASE"

              run python manage.py migrate --no-input
              run python manage.py initialize_waffle
              run python manage.py initialize_site
              run python manage.py oscar_populate_countries --initial-only
              # the admin's credentials, AM_ADMIN_USERNAME, AM_ADMIN_EMAIL and AM_ADMIN_PASSWORD, are read
              # by the command from the environment, so the password is on no command line.
              echo "--- python manage.py create_account_admin"
              python manage.py create_account_admin \
                || { echo "FAILED: python manage.py create_account_admin"; status=1; }

              exit $status
          # Account Manager's environment, from the Secret in secret-env.yaml
          envFrom:
            - secretRef:
                name: "{{ .Values.global.appName }}-env"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- range $env := .Values.app.env }}
            - name: {{ $env.name }}
              value: {{ $env.value | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "am.writableVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "am.writableVolumes" . | nindent 8 }}
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
{{- end }}
