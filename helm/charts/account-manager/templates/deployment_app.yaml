# -----------------------------------------------------------------------------------
# Deployment Manifest for the Account Manager application server (gunicorn).
#
# Its pods carry app.kubernetes.io/component: api, which the Service selects.
#
# Important: labels are referenced by other resources, in this repo (the Service) and
# in terraform/ (the ingress names the Service). Do not change them without updating
# all references.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    meta.helm.sh/release-name: "{{ .Release.Name }}"
    meta.helm.sh/release-namespace: "{{ .Release.Namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
  labels:
    {{- include "am.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: "{{ .Values.global.appName }}"
    app.kubernetes.io/component: api
  name: "{{ .Values.global.appName }}"
  namespace: "{{ .Release.Namespace }}"
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.app.replicaCount }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Values.global.appName }}"
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/env: "{{ include (print $.Template.BasePath "/secret-env.yaml") . | sha256sum }}"
      labels:
        app.kubernetes.io/name: "{{ .Values.global.appName }}"
        app.kubernetes.io/component: api
        app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
        meta.helm.sh/application-version: "{{ .Chart.Version }}"
        deploymentTimestamp: "{{ now | unixEpoch }}"
    spec:
      serviceAccountName: "{{ .Values.global.appName }}"
      automountServiceAccountToken: false
      affinity:
        {{- toYaml .Values.global.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      containers:
        - name: "{{ .Values.global.appName }}"
          image: '{{ include "am.image" . }}'
          command:
            - "gunicorn"
            - "am.wsgi:application"
            - "--bind"
            - "0.0.0.0:{{ .Values.deployment.containerPort }}"
            - "--workers={{ .Values.app.workers | default 2 }}"
            - "--timeout=60"
            - "--graceful-timeout=30"
            - "--worker-class=sync"
          imagePullPolicy: '{{ .Values.global.image.pullPolicy | default "Always" }}'
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          # Account Manager's environment, from the Secret in secret-env.yaml
          envFrom:
            - secretRef:
                name: "{{ .Values.global.appName }}-env"
          {{- with .Values.app.env }}
          env:
            {{- range $env := . }}
            - name: {{ $env.name }}
              value: {{ $env.value | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "am.writableVolumeMounts" . | nindent 12 }}
            {{- with .Values.app.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # The probes:
          #
          # - startupProbe: /healthz/ answers as soon as gunicorn has loaded the app. It is checked
          #   every 2 seconds, so the pod starts as soon as it's up, with a budget of 5 + 2 x 90
          #   seconds for a slow start. Liveness and readiness wait for it.
          # - readinessProbe: /readiness/, so the pod takes traffic once it can serve it, and is
          #   taken out of the service, not restarted, while it can't.
          # - livenessProbe: restarts a pod whose process is hung.
          #
          # The Host header is localhost, the name a probe has, rather than the pod's IP.
          startupProbe:
            httpGet:
              path: /healthz/
              port: {{ .Values.deployment.containerPort }}
              httpHeaders:
              - name: Host
                value: localhost
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /readiness/
              port: {{ .Values.deployment.containerPort }}
              httpHeaders:
              - name: Host
                value: localhost
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz/
              port: {{ .Values.deployment.containerPort }}
              httpHeaders:
              - name: Host
                value: localhost
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # the service stops sending new requests to a terminating pod a few seconds after it is
          # told to stop. preStop waits for that, before gunicorn stops accepting connections, and
          # terminationGracePeriodSeconds leaves room for gunicorn's 30 second graceful shutdown.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - containerPort: {{ .Values.deployment.containerPort }}
              protocol: TCP
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        {{- include "am.writableVolumes" . | nindent 8 }}
        {{- with .Values.app.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      terminationGracePeriodSeconds: 45
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      shareProcessNamespace: false
