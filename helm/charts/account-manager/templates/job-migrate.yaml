# -----------------------------------------------------------------------------------
# Job Manifest for Account Manager Database Migrations, before an upgrade's rollout
#
# Runs `python manage.py migrate` as a Helm pre-upgrade hook, so that the new release's
# schema exists before its pods start and take requests. Without it, the new pods serve
# requests during the rollout with code that reads columns that the post-upgrade init
# Job (job-init.yaml) hasn't added yet.
#
# - Purpose: migrate the database, and nothing else. Initialization stays in job-init.yaml.
# - Usage: rendered when databaseInit.enabled is set in values.yaml, like job-init.yaml.
# - Upgrades only. A pre-install hook runs before any of the chart's resources exist,
#   including the Secret in secret-env.yaml that holds the database's credentials, so it
#   couldn't start. On a fresh install there are no older pods, and job-init.yaml creates
#   the database and its user, then migrates. On an upgrade, job-init.yaml's migrate then
#   finds nothing to do.
# - The Job reads the previous release's Secret, since Helm applies the new one after
#   pre-upgrade hooks. That is enough to migrate: the database's user and password change
#   only in job-init.yaml, after the rollout.
# - The older pods run against the new schema until the rollout replaces them. That is safe
#   for additive migrations. A removal or a rename needs two releases: one whose code stops
#   reading the column, then one that drops it.
# - A failed migration fails `helm upgrade` before the rollout, so the older pods keep
#   serving, and the failed Job is kept for `kubectl logs`.
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# -----------------------------------------------------------------------------------
{{- if .Values.databaseInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-job-migrate-{{ now | unixEpoch }}"
  namespace: "{{ .Release.Namespace }}"
  annotations:
    meta.helm.sh/release-name: "{{ .Release.Name }}"
    meta.helm.sh/release-namespace: "{{ .Release.Namespace }}"
    meta.helm.sh/application-version: "{{ .Chart.Version }}"
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
  labels:
    {{- include "am.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: "{{ .Values.global.appName }}-job-migrate"
    app.kubernetes.io/component: job-migrate
spec:
  # a migration that fails part way is not retried blindly: MariaDB's DDL isn't transactional.
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        checksum/env: "{{ include (print $.Template.BasePath "/secret-env.yaml") . | sha256sum }}"
      labels:
        app.kubernetes.io/name: "{{ .Values.global.appName }}-job-migrate"
        app.kubernetes.io/component: job-migrate
        app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
        jobTimestamp: "{{ now | unixEpoch }}"
    spec:
      serviceAccountName: "{{ .Values.global.appName }}"
      automountServiceAccountToken: false
      affinity:
        {{- toYaml .Values.global.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      containers:
        - name: "{{ .Values.global.appName }}-job-migrate"
          image: '{{ include "am.image" . }}'
          imagePullPolicy: '{{ .Values.global.image.pullPolicy | default "Always" }}'
          resources:
            requests:
              memory: "500Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1"
          command:
            - python
            - manage.py
            - migrate
            - --no-input
          # Account Manager's environment, from the Secret in secret-env.yaml (the previous release's: see above)
          envFrom:
            - secretRef:
                name: "{{ .Values.global.appName }}-env"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- range $env := .Values.app.env }}
            - name: {{ $env.name }}
              value: {{ $env.value | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "am.writableVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "am.writableVolumes" . | nindent 8 }}
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
{{- end }}
