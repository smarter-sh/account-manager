# ==============================================================================
# Smarter Account Manager - Helm Chart Values
# ==============================================================================
#
# Default configuration values for the Account Manager Helm chart:
#   - the Django application server (gunicorn)
#   - the Celery worker and beat scheduler
#   - the init and migrate jobs, which create Account Manager's database and
#     user on the shared MariaDB server and migrate it
#   - Redis (the bitnami subchart)
#
# Account Manager has no database server of its own. It uses the MariaDB server
# that the smarter Helm chart (smarter-sh/smarter, helm/charts/smarter) runs,
# the bitnami mariadb subchart's Service smarter-mariadb in the Smarter
# platform's namespace, with a database and a user of its own on that server.
#
# IMPORTANT: Replace all "SET-ME-IN-helm/charts/account-manager/values.yaml"
# values before deployment. The deploy action
# (.github/actions/deploy/action.yml) sets them from Kubernetes secrets.
#
# Usage:
#   helm upgrade --install account-manager . --namespace smarter-am-prod -f my-values.yaml
#
# Note:
# The app.kubernetes.io/application-group label is used to identify pods to Calico
# and kubernetes_network_policy_v1 resources in order to allow pod-level communication
# between backing services. If the label is missing then the network policies are
# assured to PREVENT communication.
# ==============================================================================

# -----------------------------------------------------------------------------
## @param env Account Manager's environment. Every key is written into the Secret
## <appName>-env (templates/secret-env.yaml), which every pod reads with envFrom.
## A null value is left out of the Secret.
# -----------------------------------------------------------------------------
env:
  # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are optional: prefer serviceAccount.awsRoleArn
  # (IRSA). Static keys win over the role, so set them only for a cluster without IRSA.
  AWS_REGION: "us-east-2"

  ## Cache and Celery: the Redis of the redis subchart, am-redis-master in the release's namespace
  CACHES_LOCATION: "SET-ME-IN-helm/charts/account-manager/values.yaml"
  CELERY_BROKER_URL: "SET-ME-IN-helm/charts/account-manager/values.yaml"
  CELERY_RESULT_BACKEND: "SET-ME-IN-helm/charts/account-manager/values.yaml"

  DEBUG_MODE: "false"
  ## e.g. am.settings.prod, am.settings.alpha
  DJANGO_SETTINGS_MODULE: "am.settings.prod"
  DUMP_DEFAULTS: "False"
  ## alpha, beta, next or prod
  ENVIRONMENT: "prod"
  ROOT_DOMAIN: "example.com"
  SECRET_KEY: "SET-ME-IN-helm/charts/account-manager/values.yaml"

  ## The Docker image of every pod. Empty: global.image.repository:global.image.tag
  AM_DOCKER_IMAGE: ""

  ## Database: the SHARED MariaDB server of the smarter Helm chart.
  ## AM_MYSQL_HOST is that server's in-cluster name, the Service smarter-mariadb in the
  ## Smarter platform's namespace: smarter-mariadb.<smarter-namespace>.svc.cluster.local,
  ## e.g. smarter-mariadb.smarter-ubc-alpha.svc.cluster.local.
  AM_MYSQL_HOST: "smarter-mariadb.SET-ME-SMARTER-NAMESPACE.svc.cluster.local"
  AM_MYSQL_PORT: "3306"
  ## Account Manager's own database and user on that server, which job-init.yaml creates
  AM_MYSQL_DATABASE: "SET-ME-IN-helm/charts/account-manager/values.yaml"
  AM_MYSQL_USER: "SET-ME-IN-helm/charts/account-manager/values.yaml"
  AM_MYSQL_PASSWORD: "SET-ME-IN-helm/charts/account-manager/values.yaml"
  ## the shared server's root account, which job-init.yaml creates the database and user as
  AM_MYSQL_ROOT_USERNAME: "root"
  AM_MYSQL_ROOT_PASSWORD: "SET-ME-IN-helm/charts/account-manager/values.yaml"

  ## The admin account that job-init.yaml creates (manage.py create_account_admin)
  AM_LOGIN_URL: "https://am.example.com/login/"
  AM_ADMIN_USERNAME: "admin"
  AM_ADMIN_PASSWORD: "SET-ME-IN-helm/charts/account-manager/values.yaml"
  AM_ADMIN_EMAIL: "admin@example.com"

  ## SMTP
  SMTP_HOST: "SET-ME-IN-helm/charts/account-manager/values.yaml"
  SMTP_PORT: "587"
  SMTP_USE_SSL: "false"
  SMTP_USE_TLS: "true"
  SMTP_USERNAME: "SET-ME-IN-helm/charts/account-manager/values.yaml"
  SMTP_PASSWORD: "SET-ME-IN-helm/charts/account-manager/values.yaml"


# -----------------------------------------------------------------------------
# Global Configuration
# -----------------------------------------------------------------------------
global:
  # the name of the Deployments, the Service (which terraform/'s ingress routes to), the
  # ServiceAccount and the Secret <appName>-env, and the value of every resource's
  # app.kubernetes.io/application-group label
  appName: account-manager
  image:
    pullPolicy: Always
    # used when env.AM_DOCKER_IMAGE is empty, e.g. <registry>/smarter-am-prod and a release tag
    repository: ""
    tag: ""
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-group
                operator: In
                values:
                  - smarter

  tolerations:
    - key: "node-group"
      operator: "Equal"
      value: "smarter"
      effect: "NoSchedule"

  # The security contexts of the pods that run the Account Manager image: the app, the
  # Celery worker, beat and the init and migrate jobs. They run as am_user, the user that
  # the Dockerfile creates (uid and gid 1000). runAsGroup must stay 1000: with only
  # runAsUser set, the process's group would be root's. The root filesystem is read-only;
  # the directories that the processes write are emptyDirs (templates/_helpers.tpl,
  # am.writableVolumes).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL


# -----------------------------------------------------------------------------
# Application Configuration
# -----------------------------------------------------------------------------
app:
  replicaCount: 1
  # gunicorn --workers: sync worker processes per pod
  workers: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  # extra environment variables of the app pods and the jobs, as [{name, value}]. Not secret:
  # these are written into the pod spec. Secrets go in env.
  env: []
  extraVolumes: []
  extraVolumeMounts: []

worker:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  env: []
  extraVolumes: []
  extraVolumeMounts: []

beat:
  # exactly one: two beats schedule every periodic task twice
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  env: []
  extraVolumes: []
  extraVolumeMounts: []

## @param deployTimestamp Deployment timestamp for forcing pod restarts
deployTimestamp: ""

deployment:
  containerPort: 8000

service:
  port: 8000
  targetPort: 8000

# -----------------------------------------------------------------------------
# Database initialization
# -----------------------------------------------------------------------------
databaseInit:
  # post-install/post-upgrade Job (job-init.yaml): create the database and its user on the
  # shared MariaDB server, migrate, initialize. Also a pre-upgrade Job that migrates before the
  # rollout (job-migrate.yaml), so that new pods never run without their schema.
  enabled: true

# -----------------------------------------------------------------------------
# Account Manager's ServiceAccount (templates/serviceaccount.yaml)
# -----------------------------------------------------------------------------
serviceAccount:
  # the IAM role (IRSA) that the pods use for S3 and SES, e.g.
  # arn:aws:iam::<account>:role/<namespace>-account-manager. Empty: the pods use
  # env.AWS_ACCESS_KEY_ID and env.AWS_SECRET_ACCESS_KEY.
  awsRoleArn: ""

# -----------------------------------------------------------------------------
# Backing Services Configuration
# -----------------------------------------------------------------------------
redis:
  enabled: true
  external:
    host: ""
    port: 6379
    password: ""
  fullnameOverride: "am-redis"
  auth:
    enabled: true
    password: "am"
  architecture: standalone
  master:
    podLabels:
      app.kubernetes.io/application-group: "{{ .Values.global.appName }}"
    containerSecurityContext:
      enabled: true
    persistence:
      enabled: true
      size: 1Gi
    podSecurityContext:
      enabled: true
    resources:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "512m"
    service:
      headless:
        sessionAffinity: None
